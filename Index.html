<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=./">
  <link rel="canonical" href="./">
  <title>الرابط اتغيّر — Products Cost Check</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f4f5f7; color: #1f2933;
      font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      background: #fff; border-radius: 14px; padding: 32px 28px;
      max-width: 460px; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    h1 { font-size: 20px; margin: 0 0 14px; }
    p  { font-size: 15px; line-height: 1.9; margin: 0 0 22px; color: #52606d; }
    a.btn {
      display: inline-block; padding: 12px 26px; border-radius: 8px;
      background: #2563eb; color: #fff; text-decoration: none; font-size: 15px;
    }
    a.btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>الرابط اتغيّر</h1>
    <p>
      الصفحة دي اتنقلت للرابط الجديد، وجارٍ تحويلك دلوقتي.
      لو مش اتحوّلت خلال ثواني، اضغط الزرار تحت.
      <br>
      ومن فضلك <strong>حدّث الـ bookmark</strong> بتاعك على الرابط الجديد.
    </p>
    <a class="btn" href="./">افتح الأداة</a>
  </div>
</body>
</html>
